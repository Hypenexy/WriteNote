<!DOCTYPE html>
<html style="background:#111" lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDUITesting</title>
    <link rel="stylesheet" href='../../style/app.css'>
    <link rel="stylesheet" href="../../style/MDUI.css">
</head>
<body>
    <script src="../../code/libraries/MDUtils.js"></script>
    <script src="../../code/writenote/MDUI.js"></script>
    <script>
        var locale = {
            "hi1" : "hi",
            "updateloc" : "update loc",
            "highlightHi" : "highlight hi"
        }
        var ui = new MDUI(true)
        ui.init()
        
        var login = ui.createModal()
        login.createButton("hi1", console.log)
        login.createButton("updateloc", function(){
            locale = {
                "hi1" : "zdr",
                "updateloc" : "It is updated now!",
                "highlightHi" : "highlight hi"
            }
            ui.updateLocalization()
        })
        login.createButton("highlightHi", function(){
            ui.highlightElementByLocalization("hi1")
        })
    </script>
</body>
</html>
