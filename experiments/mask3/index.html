<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: sans-serif;
            margin: 0;
        }
        html, body{
            width: 100%;
            height: 100%;
        }
        .protector{
            display: block;
            height: 100%;
            background: #111;
            color: #fff;
            padding: 12px;
        }
        button{
            position: absolute;
            /* bottom: 100px; */
            display: block;
            border-radius: 8px;
            padding: 14px 2px;
            height: 250px;
            margin: 20px 0;
        }
        border{
            background: #111;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
        }
        h1.bgfx{
            background: var(--bg);
            padding: 40px;
            border-radius: 12px;
        }
        button.bgfx{
            background: var(--bg);
        }
        .d{
            position: absolute;
            bottom: 10px;
            padding: 0 20px;
            height: 120px;
        }
    </style>
</head>
<body>
    <div class="protector">
        <h1 class="bgfx">Cool data</h1>
        <button class="bgfx"><border>butto this is high so u see the difference</border></button>
        <button class="bgfx d"><border>Anothe button!</border></button>
    </div>
    <script>
        var getStepColor = function(colorA, colorB, value) {
            return colorA.map(function(color, i) {
                return (color + value * (colorB[i] - color)) & 255
            })
        }

        var highQuality = true

        function colorize(){
            var protector = document.getElementsByClassName("protector")[0]
            var everythingInside = protector.getElementsByClassName("bgfx")
            for (let i = 0; i < everythingInside.length; i++) {
                const element = everythingInside[i];
        
                var ratioTop = element.getBoundingClientRect().top / window.innerHeight
                if(ratioTop>1){
                    ratioTop = 1
                }
                if(ratioTop<0){
                    ratioTop = 0
                }
                var colorTop = getStepColor([51,40,235], [250,212,255], ratioTop)
                var ratioBottom = element.getBoundingClientRect().bottom / window.innerHeight
                if(ratioBottom>1){
                    ratioBottom = 1
                }
                if(ratioBottom<0){
                    ratioBottom = 0
                }
                var colorBottom = getStepColor([51,40,235], [250,212,255], ratioBottom)
                element.style.setProperty('--bg', "linear-gradient(180deg, rgb("+colorTop+") 0%, rgb("+colorBottom+")");
            }
        }
        // var doit
        // window.onresize = function(){
        //     if(highQuality==false){
        //         clearTimeout(doit)
        //         doit = setTimeout(colorize, 100)
        //     }
        //     else{
        //         colorize()
        //     }
        // }
        // colorize()


        /**
         * Calculates the value of a ratio between the colors.
         * Requires: MDUtils.getStepColor, MDUI.highQuality
         * Note that it will not update when elements move without resizing the window,
         * a fix to this is to return the render function and call it every time something moves.
         * @param {HTMLElement} containerElement Element supporting elements with bgfx class
         * @param {[r,g,b]} colorA First color
         * @param {[r,g,b]} colorB Second color
         * @param {Int} degrees A number that is either 0, 45, 90, 135, 180, 225, 270, 315, 360
         * @returns Result status
         */
        function colorizeButBetter(containerElement, colorA, colorB, degrees){
            var elements = containerElement.getElementsByClassName("bgfx")
            function render(){
                for (let i = 0; i < elements.length; i++) {
                    const element = elements[i];
                    var elementPosition = element.getBoundingClientRect()
                    function correctRatio(ratio){
                        if(ratio>1){
                            return 1
                        }
                        else{
                            if(ratio<0){
                                return 0
                            }
                            else{
                                return ratio
                            }
                        }
                    }
                    var elementRatios = {
                        left: correctRatio(elementPosition.left/window.innerWidth),
                        top: correctRatio(elementPosition.top/window.innerHeight),
                        right: correctRatio(elementPosition.right/window.innerWidth),
                        bottom: correctRatio(elementPosition.bottom/window.innerHeight)
                    }
                    var colorAElement
                    var colorBElement
                    switch (degrees) {
                        case 0:
                            //bottom to top
                            colorAElement = getStepColor(colorA, colorB, elementRatios.bottom)
                            colorBElement = getStepColor(colorA, colorB, elementRatios.top)
                            break;
                        case 45:
                            //diagonal ! ok i am stupid how do i calculate
                            colorAElement = getStepColor(colorA, colorB, elementRatios.bottom)
                            colorBElement = getStepColor(colorA, colorB, elementRatios.top)
                        case 90:
                            //left to right, or the opposite, what
                            colorAElement = getStepColor(colorA, colorB, elementRatios.left)
                            colorBElement = getStepColor(colorA, colorB, elementRatios.right)
                        case 180:
                            //top to bottom
                            colorAElement = getStepColor(colorB, colorA, elementRatios.top)
                            colorBElement = getStepColor(colorB, colorA, elementRatios.bottom)
                            break;
                        default:
                            break;
                    }
                    element.style.setProperty('--bg', "linear-gradient("+degrees+"deg, rgb("+colorAElement+") 0%, rgb("+colorBElement+")")
                    console.log(elementRatios)
                }
            }
            var timeout
            window.addEventListener("resize", function(){
                if(highQuality==false){
                    clearTimeout(timeout)
                    timeout = setTimeout(render, 100)
                }
                else{
                    render()
                }
            })
            render()
        }

        colorizeButBetter(document.getElementsByClassName("protector")[0], [51,40,235], [250,212,255], 0)
    </script>
</body>
</html>
