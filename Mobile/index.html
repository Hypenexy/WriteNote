    var header = document.getElementsByTagName("header")[0]
    var hr = document.getElementsByTagName("hr")[0]
    hr.addEventListener("click", function(){
        if(header.classList[0] == "headeractive"){
            header.classList.remove("headeractive")
        }
        else{
            header.classList.add("headeractive")
            navigator.vibrate(50)
        }
    })

    var addbtn = document.querySelectorAll('[data-action="addSomething"]')[0]
    var adddiv = document.querySelectorAll('[data-action="addSomething"]')[1]

    document.addEventListener("click", function(e){
      if(e.target!=addbtn && e.target.parentNode != addbtn){
        adddiv.classList.remove("activediv")
      }
      else{
        adddiv.classList.add("activediv")
      }
    })
    addbtn.addEventListener("mouseover", function(){
        adddiv.classList.add("activediv")
    })
  </script>
</body>
</html>
