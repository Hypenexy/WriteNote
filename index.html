<body>
    <app></app>
    <script src="code/libraries/MDUtils.js"></script>
    <script src="code/libraries/jquery-3.6.0.min.js"></script>
    <script src="code/libraries/swiped-events.min.js"></script>
    <script src="code/writenote/app.js"></script>
    <script src="code/writenote/sidepanel.js"></script>
    <script src="code/writenote/writenote.js"></script>
    <script src="code/writenote/header.js"></script>
    <script src="code/writenote/mobileExperiment.js"></script>
    <script src="code/writenote/project.js"></script>
    <script src="code/writenote/welcome.js"></script>
    <script>
      var welcomegui = document.createElement("div")
      welcomegui.style = "position:absolute;z-index:99;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:32px;background:#11111155;padding:24px;border-radius:8px"
      welcomegui.innerHTML = "Welcome to WriteNote 3.0.0 Beta!"
      var existing = CheckExisting()
      for(let i = 0; i < existing.length; i++){
        const element = existing[i];

        var parts = element.split(":")
        var space = parts[0]
        var pathname = parts[1]
        pathname = pathname.split("*").slice(1).join('*')
        var path = pathname.split("*")[0]
        var name = pathname.split("*").slice(1).join('*')

        function createButton(path, name, space){
          var button = document.createElement("button")
          if(path){
            button.innerHTML = path + "/" + name
          }
          else{
            button.innerHTML = name
          }
          button.style = "display:block;font-size:16px;border:1px solid #bbb;margin:4px;padding:4px"
          ButtonEvent(button, function(){LoadFile(space, path, name);welcomegui.remove()})
          return button;
        }

        welcomegui.appendChild(createButton(path, name, space))
      }
      var p = document.createElement("p")
      p.style = "font-size:16px;text-align:center;color:#999;font-weight:500"
      p.innerHTML = "<p>This will close upon clicking to type.</p>"
      welcomegui.appendChild(p)
      //app.appendChild(welcomegui)
      notearea.addEventListener("focus", function(){
        welcomegui.remove()
      })
    </script>
</body>
