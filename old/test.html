<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body,html {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a;
        }
        * {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }
        #notearea{
            box-sizing: border-box;
            border: 1px solid #222230;
            border-top: 1px solid #555;
            border-radius: 0;
            cursor: auto;
            resize: none;
            outline: none;
            color: white;
            font-size: 24px;
            background-color: #222230;
            width: calc(100% - 6px);
            height: 100%;
        }
        #notearea a{
            color: #fff;
        }
        #linkinfo{
            position: relative;
            cursor: pointer;
            position: absolute;
            border: 1px solid #bbb;
            background: #111;
            color: #f8f8f8;
            border-radius: 4px;
            transform: translate(-20%, 0);
        }
        #linkinfo p{
            color: #888;
            margin: 0;
            padding: 4px 12px;
        }
        #linkinfo #linkmetadata{
            padding: 16px 16px;
        }
        #linkinfo linktle{
            display: block;
            font-size: 24px;
        }
        #linkinfo linkdes{
            font-size: 16px;
        }
    </style>
    <div style="display: none" id="linkinfo">
        dies
    </div>
    <div id="notearea" contenteditable="true" style="border: 1px solid #bbb; font-size: 32px;">
        hey there! <img width="10%" src="lowpolyc.png"> <a href="https://writenote.midelight.net">writenote</a>
    </div>

    <script>
        var allowclose = true;
        var notearea = document.getElementById("notearea")
        var linkinfo = document.getElementById("linkinfo")
        var linkurl;
        notearea.addEventListener('dblclick', function (e) {
            if(e.target.href){
                open(e.target.href)
            }
        })
        notearea.addEventListener('mouseover', function (e) {
            if(e.target.href){
                if(linkinfo.style.display != "block"){
                    allowclose = false
                    linkurl = e.target.href
                    linkinfo.innerHTML = "<div id='linkmetadata'><img width='48px' src='" + "writenotepearl.ico" + "'><linktle id='linktitle'>" + "WriteNote" + "</linktle><linkdes>" + "Write, share, save notes with an upgraded online experience." +"</linkdes></div>" + "<p>Links to " + e.target.href + "</p>"
                    linkinfo.style.display = "block"
                    linkinfo.style.top = e.target.offsetTop + 50 + "px"
                    linkinfo.style.left = e.target.offsetLeft - 10 + "px"
                }
            }
        })
        linkinfo.addEventListener('mouseover', function (e) {
            allowclose = false;
            document.getElementById("linktitle").style.textDecoration = "underline";
        })
        linkinfo.addEventListener('click', function () {
            open(linkurl)
        })
        linkinfo.addEventListener('mouseout', function (e) {
            allowclose = true;
            document.getElementById("linktitle").style.removeProperty("text-decoration")
            setTimeout(function () {
                if(allowclose){
                    linkinfo.style.display = "none"
                }
            }, 500);
        })
        notearea.addEventListener('mouseout', function (e) {
            if(e.target.href){
                allowclose = true;
                setTimeout(function () {
                    if(allowclose){

                        linkinfo.style.display = "none"
                    }
                }, 1000);
            }
        })
    </script>
</body>
</html>
